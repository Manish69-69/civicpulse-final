<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicPulse – Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#2563eb;--blue-dark:#1d4ed8;--green:#16a34a;--yellow:#d97706;
  --red:#dc2626;--purple:#7c3aed;--gray:#6b7280;--bg:#f1f5f9;--card:#fff;
  --border:#e2e8f0;--text:#1e293b;--muted:#64748b;--sidebar:#1e293b
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* NAV */
nav{background:var(--sidebar);color:#fff;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-brand{font-size:1.1rem;font-weight:700}
.nav-brand em{color:#94a3b8;font-style:normal;font-size:.8rem;margin-left:.5rem}
.nav-right{display:flex;align-items:center;gap:1rem}
#navUser{font-size:.85rem;color:#94a3b8}
.nav-btn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:.35rem .85rem;border-radius:6px;cursor:pointer;font-size:.8rem;transition:background .2s}
.nav-btn:hover{background:rgba(255,255,255,.2)}

/* AUTH WALL */
#authWall{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);flex-direction:column;gap:1.5rem}
.auth-box{background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-box h2{font-size:1.4rem;font-weight:800;margin-bottom:.4rem}
.auth-box p{color:var(--muted);font-size:.875rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:.65rem .85rem;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;color:var(--text);transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.25rem;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-primary:hover{background:var(--blue-dark)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-sm{padding:.35rem .75rem;font-size:.775rem}
.btn-green{background:#dcfce7;color:#166534}
.btn-green:hover{background:#bbf7d0}
.btn-yellow{background:#fef3c7;color:#92400e}
.btn-yellow:hover{background:#fde68a}
.btn-red{background:#fee2e2;color:#991b1b}
.btn-red:hover{background:#fecaca}
.btn-blue{background:#dbeafe;color:#1e40af}
.btn-blue:hover{background:#bfdbfe}
.err{color:var(--red);font-size:.825rem;margin-top:.75rem;text-align:center;background:#fef2f2;padding:.5rem;border-radius:6px}

/* MAIN */
#adminMain{display:none;flex:1}
.content{max-width:1100px;margin:0 auto;padding:1.5rem}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border-radius:12px;padding:1.25rem;border:1px solid var(--border);text-align:center}
.stat-num{font-size:2rem;font-weight:800;line-height:1}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:.35rem;text-transform:uppercase;letter-spacing:.04em}
.stat-total .stat-num{color:var(--blue)}
.stat-pending .stat-num{color:var(--yellow)}
.stat-progress .stat-num{color:#7c3aed}
.stat-resolved .stat-num{color:var(--green)}
.stat-rejected .stat-num{color:var(--red)}

/* FILTER BAR */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.toolbar h2{font-size:1.1rem;font-weight:700}
.filter-row{display:flex;gap:.4rem;flex-wrap:wrap}
.filter-btn{padding:.3rem .7rem;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:.775rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.search-box{padding:.45rem .85rem;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;min-width:180px}
.search-box:focus{outline:none;border-color:var(--blue)}

/* COMPLAINT ROWS */
.complaint-card{background:var(--card);border-radius:10px;padding:1.1rem 1.25rem;border:1px solid var(--border);margin-bottom:.75rem}
.cc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.cc-title{font-weight:600;font-size:.95rem}
.cc-submitter{font-size:.775rem;color:var(--muted);margin-top:.2rem}
.cc-meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.5rem}
.cc-desc{color:var(--muted);font-size:.85rem;margin-top:.5rem;line-height:1.5}
.cat-badge{background:#f1f5f9;color:var(--muted);padding:.2rem .55rem;border-radius:12px;font-size:.72rem;font-weight:600}
.loc-badge{font-size:.72rem;color:var(--muted)}
.badge{padding:.25rem .65rem;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-in_progress{background:#dbeafe;color:#1e40af}
.badge-resolved{background:#dcfce7;color:#166534}
.badge-rejected{background:#fee2e2;color:#991b1b}

.cc-image-wrap{margin-top:.75rem}
.cc-image-wrap img{max-height:160px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:opacity .2s}
.cc-image-wrap img:hover{opacity:.85}
.no-photo{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;color:#cbd5e1;background:#f8fafc;padding:.35rem .65rem;border-radius:6px;border:1px dashed var(--border)}

/* UPDATE PANEL */
.update-panel{margin-top:.85rem;padding-top:.85rem;border-top:1px solid var(--border)}
.update-row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end}
.update-row .field{margin:0;flex:1;min-width:160px}
.notes-row{margin-top:.5rem}
.notes-row textarea{min-height:60px}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.75rem 1.25rem;border-radius:10px;color:#fff;font-size:.875rem;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;max-width:300px}
.toast.show{opacity:1;transform:translateY(0)}
.toast-success{background:#16a34a}
.toast-error{background:#dc2626}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-overlay img{max-width:90vw;max-height:90vh;border-radius:12px}
.modal-close{position:absolute;top:1rem;right:1.5rem;color:#fff;font-size:2rem;cursor:pointer;line-height:1}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.spinner{border:3px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;width:28px;height:28px;animation:spin .7s linear infinite;margin:2rem auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){.stats-grid{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<!-- AUTH WALL -->
<div id="authWall">
  <div class="auth-box">
    <h2>🔐 Admin Login</h2>
    <p>Sign in with your administrator account to manage complaints.</p>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" value="admin@demo.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword" value="admin123" autocomplete="current-password"></div>
    <button class="btn btn-primary" onclick="doLogin()">Sign In as Admin</button>
    <div id="loginErr" class="err" style="display:none"></div>
  </div>
</div>

<!-- NAV -->
<nav id="adminNav" style="display:none">
  <div class="nav-brand">🏛️ CivicPulse <em>Admin Panel</em></div>
  <div class="nav-right">
    <a href="/" style="color:#94a3b8;font-size:.8rem">← Citizen Portal</a>
    <span id="navUser"></span>
    <button class="nav-btn" onclick="logout()">Sign Out</button>
  </div>
</nav>

<!-- ADMIN MAIN -->
<div id="adminMain">
  <div class="content">

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card stat-total"><div class="stat-num" id="sTotal">–</div><div class="stat-label">Total</div></div>
      <div class="stat-card stat-pending"><div class="stat-num" id="sPending">–</div><div class="stat-label">Pending</div></div>
      <div class="stat-card stat-progress"><div class="stat-num" id="sProgress">–</div><div class="stat-label">In Progress</div></div>
      <div class="stat-card stat-resolved"><div class="stat-num" id="sResolved">–</div><div class="stat-label">Resolved</div></div>
      <div class="stat-card stat-rejected"><div class="stat-num" id="sRejected">–</div><div class="stat-label">Rejected</div></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <h2>All Complaints</h2>
      <input class="search-box" type="text" id="searchBox" placeholder="Search by title, user, location…" oninput="renderComplaints()">
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
        <button class="filter-btn" onclick="setFilter('in_progress',this)">In Progress</button>
        <button class="filter-btn" onclick="setFilter('resolved',this)">Resolved</button>
        <button class="filter-btn" onclick="setFilter('rejected',this)">Rejected</button>
      </div>
    </div>

    <div id="complaintsList"></div>
  </div>
</div>

<!-- Image Modal -->
<div class="modal-overlay" id="imgModal" onclick="this.classList.remove('open')">
  <span class="modal-close">×</span>
  <img id="modalImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
let token = localStorage.getItem('cp_admin_token');
let currentUser = null;
let allComplaints = [];
let currentFilter = 'all';

window.onload = () => {
  if (token) {
    try {
      const pl = JSON.parse(atob(token.split('.')[1]));
      if (pl.exp * 1000 > Date.now() && pl.role === 'admin') {
        currentUser = pl;
        showAdmin();
        return;
      }
    } catch {}
    localStorage.removeItem('cp_admin_token');
  }
};

function showAdmin() {
  document.getElementById('authWall').style.display = 'none';
  document.getElementById('adminNav').style.display = 'flex';
  document.getElementById('adminMain').style.display = 'block';
  document.getElementById('navUser').textContent = currentUser.name;
  loadStats();
  loadComplaints();
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';

  const btn = document.querySelector('#authWall .btn-primary');
  btn.disabled = true; btn.textContent = 'Signing in…';

  try {
    const r = await fetch(`${API}/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error; errEl.style.display = 'block'; return; }
    if (d.user.role !== 'admin') { errEl.textContent = 'This account does not have admin access.'; errEl.style.display = 'block'; return; }
    token = d.token;
    currentUser = d.user;
    localStorage.setItem('cp_admin_token', token);
    showAdmin();
  } catch {
    errEl.textContent = 'Connection error. Try again.'; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In as Admin';
  }
}

function logout() {
  localStorage.removeItem('cp_admin_token');
  location.reload();
}

async function loadStats() {
  try {
    const r = await fetch(`${API}/stats`, { headers: authH() });
    const d = await r.json();
    document.getElementById('sTotal').textContent    = d.total;
    document.getElementById('sPending').textContent  = d.pending;
    document.getElementById('sProgress').textContent = d.progress;
    document.getElementById('sResolved').textContent = d.resolved;
    document.getElementById('sRejected').textContent = d.rejected;
  } catch {}
}

async function loadComplaints() {
  const el = document.getElementById('complaintsList');
  el.innerHTML = '<div class="spinner"></div>';
  try {
    const r = await fetch(`${API}/complaints`, { headers: authH() });
    if (!r.ok) throw new Error();
    allComplaints = await r.json();
    renderComplaints();
  } catch {
    el.innerHTML = '<p class="empty">Failed to load complaints.</p>';
  }
}

function renderComplaints() {
  const search = document.getElementById('searchBox')?.value.toLowerCase() || '';
  let list = currentFilter === 'all' ? allComplaints : allComplaints.filter(c => c.status === currentFilter);
  if (search) list = list.filter(c =>
    c.title.toLowerCase().includes(search) ||
    (c.user_name||'').toLowerCase().includes(search) ||
    (c.user_email||'').toLowerCase().includes(search) ||
    c.location.toLowerCase().includes(search) ||
    c.description.toLowerCase().includes(search)
  );

  const el = document.getElementById('complaintsList');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><p>No complaints match the current filter.</p></div>';
    return;
  }

  el.innerHTML = list.map(c => `
    <div class="complaint-card" id="cc-${c.id}">
      <div class="cc-top">
        <div style="flex:1">
          <div class="cc-title">${esc(c.title)}</div>
          <div class="cc-submitter">👤 ${esc(c.user_name)} &lt;${esc(c.user_email)}&gt;</div>
          <div class="cc-meta">
            <span class="cat-badge">${esc(c.category)}</span>
            <span class="loc-badge">📍 ${esc(c.location)}</span>
            <span class="loc-badge">🕒 ${fmtDate(c.created_at)}</span>
          </div>
        </div>
        <span class="badge badge-${c.status}" id="badge-${c.id}">${statusLabel(c.status)}</span>
      </div>
      <div class="cc-desc">${esc(c.description)}</div>

      ${c.image
        ? `<div class="cc-image-wrap">
             <img src="${c.image}" alt="Complaint photo" onclick="openImg('${c.image}')" title="Click to enlarge">
           </div>`
        : `<div style="margin-top:.5rem"><span class="no-photo">📷 No photo attached</span></div>`
      }

      ${c.admin_notes ? `<div style="margin-top:.5rem;padding:.5rem .75rem;background:#f0fdf4;border-radius:6px;font-size:.825rem;color:#166534;border-left:3px solid #16a34a">✅ Note: ${esc(c.admin_notes)}</div>` : ''}

      <!-- Update Panel -->
      <div class="update-panel">
        <div class="update-row">
          <div class="field">
            <label>Update Status</label>
            <select id="sel-${c.id}">
              <option value="pending"     ${c.status==='pending'?'selected':''}>Pending</option>
              <option value="in_progress" ${c.status==='in_progress'?'selected':''}>In Progress</option>
              <option value="resolved"    ${c.status==='resolved'?'selected':''}>Resolved</option>
              <option value="rejected"    ${c.status==='rejected'?'selected':''}>Rejected</option>
            </select>
          </div>
          <button class="btn btn-sm btn-blue" onclick="updateComplaint(${c.id})" id="upd-${c.id}">Save Update</button>
        </div>
        <div class="notes-row">
          <div class="field">
            <label>Admin Notes / Response</label>
            <textarea id="notes-${c.id}" placeholder="Add a note or response for the citizen…">${esc(c.admin_notes||'')}</textarea>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

async function updateComplaint(id) {
  const status = document.getElementById(`sel-${id}`).value;
  const notes  = document.getElementById(`notes-${id}`).value;
  const btn    = document.getElementById(`upd-${id}`);
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    const r = await fetch(`${API}/complaints/${id}`, {
      method: 'PATCH',
      headers: { ...authH(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, admin_notes: notes })
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Update failed', 'error'); return; }

    // Update in local array
    const idx = allComplaints.findIndex(c => c.id === id);
    if (idx !== -1) { allComplaints[idx].status = status; allComplaints[idx].admin_notes = notes; }

    // Update badge without full re-render
    const badge = document.getElementById(`badge-${id}`);
    badge.className = `badge badge-${status}`;
    badge.textContent = statusLabel(status);

    toast('Complaint updated successfully!', 'success');
    loadStats();
  } catch {
    toast('Connection error.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Update';
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderComplaints();
}

function authH() { return { Authorization: `Bearer ${token}` }; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s) { return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function statusLabel(s) { return {pending:'Pending',in_progress:'In Progress',resolved:'Resolved',rejected:'Rejected'}[s]||s; }
function openImg(src) { document.getElementById('modalImg').src = src; document.getElementById('imgModal').classList.add('open'); }
function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast toast-${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && document.getElementById('authWall').style.display!=='none') doLogin();
});
</script>
</body>
</html>
